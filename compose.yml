name: gatekeeper

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gatekeeper
    ports: ["5433:5432"]
    # Docker defaults /dev/shm to 64 MB. Postgres uses shared memory segments for
    # parallel workers, and building an HNSW index over 74k vectors overruns it with
    # `could not resize shared memory segment ... No space left on device` — a disk-full
    # error that has nothing to do with disk.
    shm_size: 1gb
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gatekeeper"]
      interval: 3s
      timeout: 3s
      retries: 20
    profiles: ["core"]

  redis:
    image: redis:7-alpine
    ports: ["6380:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
    profiles: ["core"]

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9003"
    environment:
      MINIO_ROOT_USER: gatekeeper
      MINIO_ROOT_PASSWORD: gatekeeper
    ports: ["9002:9000", "9003:9003"]
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20
    profiles: ["core"]

  # Opt-in: `docker compose --profile observability up -d jaeger`. Deliberately not in
  # the `core` profile -- tracing is off unless GK_OTEL_ENDPOINT is set, and the default
  # `make bootstrap` should not require a collector to be running.
  jaeger:
    image: jaegertracing/all-in-one:1.60
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"  # UI
      - "4317:4317"    # OTLP gRPC -- the endpoint GK_OTEL_ENDPOINT points at
    profiles: ["observability"]

volumes:
  pgdata:
  miniodata:

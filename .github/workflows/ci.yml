name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GK_DATABASE_OWNER_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/gatekeeper
  GK_DATABASE_URL: postgresql+asyncpg://gatekeeper_app:gatekeeper_app@localhost:5432/gatekeeper

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-extras
      - run: uv run ruff check src tests scripts
      - run: uv run ruff format --check src tests scripts
      - run: uv run mypy src scripts

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gatekeeper
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d gatekeeper"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Cache the local embedding model
        # bge-small is ~130 MB. Downloading it on every run would dominate CI time.
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-bge-small-en-v1.5
      - run: uv sync --all-extras
      - name: Apply migrations
        run: uv run alembic upgrade head
      - name: Verify migrations are reversible
        # A downgrade that does not work is a downgrade that will not be there when it
        # is needed, which for the RLS migration means no way to recover a broken policy.
        #
        # Safe here because CI's database is disposable. Locally use `make migrate-check`,
        # which builds a scratch database: running `downgrade base` against a working DB
        # drops every table, and doing it once cost a 40-minute reindex.
        run: |
          uv run alembic downgrade base
          uv run alembic upgrade head
      - name: Seed the tenant and its principals
        # Not the corpus — that needs the handbook cloned and ~45 minutes to embed. Only
        # the tenant and the seven principals, which is what the MCP and indirect-injection
        # suites actually require. Without this they fail with "no principal 'wren'", and
        # they passed locally only because a full `corpus load` had been run by hand.
        run: uv run gatekeeper principals seed
      - name: Unit tests
        run: uv run pytest tests/unit -q
      - name: RLS and retrieval integration tests
        run: uv run pytest tests/integration -q

  authorization-gate:
    # A separate job so a failure here is unmistakable in the checks list. These are the
    # tests that decide whether the project's central claim is true; they must never be
    # skipped, quarantined, or folded into a general "tests" green tick.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gatekeeper
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d gatekeeper"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-extras
      - run: uv run alembic upgrade head
      - run: uv run gatekeeper principals seed
      - name: Access model — oracle vs database, RLS, ABAC, audit chain, pipeline arms
        run: |
          uv run pytest -q \
            tests/unit/test_oracle.py \
            tests/unit/test_acl_overrides.py \
            tests/unit/test_audit.py \
            tests/integration/test_rls.py \
            tests/integration/test_abac.py \
            tests/integration/test_audit_chain.py \
            tests/integration/test_pipeline.py \
            tests/unit/test_injection.py
      - name: Note
        run: |
          echo "The full red-team corpus (\`make redteam\`) needs an embedded corpus and" \
               "runs locally or nightly, not per-PR. The reconciliation it performs over" \
               "the whole corpus is performed here over the ABAC fixture." \
               >> $GITHUB_STEP_SUMMARY

  acl-review:
    # Changes to the access model get their own visible check, so an ACL edit can never
    # ride along unnoticed in an unrelated pull request.
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Flag changes to the authorization surface
        run: |
          changed=$(git diff --name-only origin/${{ github.base_ref }}...HEAD \
            -- corpus/acl_rules.yaml 'infra/migrations/**' src/gatekeeper/core/principal.py)
          if [ -n "$changed" ]; then
            echo "::warning title=Authorization surface changed::$changed"
            echo "### ⚠️ Authorization surface changed" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "$changed" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "No changes to the authorization surface." >> $GITHUB_STEP_SUMMARY
          fi

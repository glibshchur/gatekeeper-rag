# ---------------------------------------------------------------------------
# Golden retrieval set for the GitLab Handbook corpus.
#
# Three decisions about how this set was built, because they determine what the
# numbers computed from it are allowed to claim:
#
# 1. **Hand-written, not generated from chunk text.** The tempting shortcut is to sample
#    a chunk and turn its own sentences into a query. That makes the eval circular: the
#    query is drawn from the document being retrieved, so lexical search wins by
#    construction and the dense-vs-hybrid comparison measures nothing. Every question
#    here was written by reading the corpus and asking what someone would actually type.
#
# 2. **Relevance is labelled at document level.** `relevant` lists document paths, not
#    chunk ids. Chunk-level labels are more precise and vastly more expensive, and the
#    question a user has is "did it find the right document", which is what this measures.
#    A consequence worth knowing: Recall@10 over documents is more forgiving than
#    Recall@10 over chunks, because ten chunks can come from fewer than ten documents.
#
# 3. **Every question is asked by a principal who is entitled to the answer.** Metrics
#    are computed under that principal's authorization, so this measures the system as
#    deployed rather than an unauthorized ideal. Questions whose answer the asker cannot
#    reach belong in the red-team corpus, not here.
#
# `category: lexical` marks questions built around identifiers, acronyms, and figures --
# the class dense retrieval is structurally bad at. They are separated out so the hybrid
# arm's advantage can be attributed rather than just observed.
# ---------------------------------------------------------------------------
version: 1


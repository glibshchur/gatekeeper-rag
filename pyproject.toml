[project]
name = "gatekeeper-rag"
version = "0.0.1"
description = "Permission-aware enterprise RAG platform with authorization enforced in the database"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }

dependencies = [
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "pyyaml>=6.0.2",
    "python-frontmatter>=1.1.0",
    "structlog>=24.4.0",
    "typer>=0.15.1",
    "rich>=13.9.4",
    "boto3>=1.35.0",
    "pgvector>=0.3.6",
    "numpy>=2.1.0",
    "onnxruntime>=1.20.0",
    "tokenizers>=0.21.0",
    "huggingface-hub>=0.27.0",
]

[project.optional-dependencies]
# Hosted model providers are optional on purpose: everything except answer generation
# runs with no API key at all, via the local ONNX backend.
providers = [
    "openai>=1.60.0",
    "anthropic>=0.45.0",
    "tiktoken>=0.8.0",
]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.0",
    "psycopg2-binary>=2.9.10",
    "ruff>=0.8.6",
    "mypy>=1.14.1",
    "types-pyyaml>=6.0.12",
    "boto3-stubs[s3]>=1.35.0",
]

[project.scripts]
gatekeeper = "gatekeeper.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gatekeeper"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# TC (flake8-type-checking) is deliberately not selected: Pydantic and SQLAlchemy resolve
# annotations at runtime, so moving those imports into `if TYPE_CHECKING` blocks breaks
# model construction. Enforcing it here would trade a real bug for a cosmetic one.
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF"]
ignore = ["A003"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
explicit_package_bases = true
namespace_packages = true

[[tool.mypy.overrides]]
# frontmatter and onnxruntime ship no stubs; openai/tiktoken live in an optional extra
# and are imported lazily, so they are legitimately absent from a default install.
module = ["frontmatter.*", "onnxruntime.*", "openai.*", "tiktoken.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["integration: requires a live Postgres (testcontainers or compose)"]
